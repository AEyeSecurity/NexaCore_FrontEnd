# SonarQube Cloud - alcance del modulo Financiero (Anexo B.5)
sonar.organization=nexacore-calidad
sonar.projectKey=nexacore-calidad_frontend
sonar.projectName=NexaCore Frontend - Finanzas
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Codigo fuente: solo los archivos del modulo Financiero
sonar.sources=src
sonar.inclusions=src/modules/finance/**/*.jsx,\
  src/components/Movimientos.jsx,\
  src/components/FormMovimiento.jsx,\
  src/components/Comprobantes.jsx,\
  src/components/Salarios.jsx,\
  src/components/Suscripciones.jsx,\
  src/components/ImportarExcel.jsx,\
  src/lib/dolarService.js

# Sin umbral de cobertura en el frontend (solo bugs y duplicacion)
sonar.coverage.exclusions=**/*